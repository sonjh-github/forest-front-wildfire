server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://s3.amazonaws.com; connect-src 'self' https://api.forest.tobeunicorn.kr https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://s3.amazonaws.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /demo-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","scenario":"forest-service-demo","entry":"/?demo=1"}\n';
    }

    # 새 배포 시 브라우저가 항상 최신 해시 번들을 찾도록 HTML은 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite 정적 파일은 파일명에 콘텐츠 해시가 포함되므로 안전하게 장기 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
