name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forest-front-wildfire-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Verify production image
        run: |
          docker build             --build-arg VITE_API_BASE_URL=https://api.forest.tobeunicorn.kr             --build-arg VITE_DASHBOARD_API_BASE_URL=https://api.forest.tobeunicorn.kr             -t forest-front-wildfire:verify .

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e

            APP_DIR=/home/ubuntu/server/forest-front-wildfire
            REPO_URL=https://github.com/sonjh-github/forest-front-wildfire.git
            AUTH_REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/sonjh-github/forest-front-wildfire.git"

            mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git init
              git remote add origin "$REPO_URL"
            else
              cd "$APP_DIR"
            fi

            git fetch "$AUTH_REPO_URL" main
            git reset --hard FETCH_HEAD

            docker build               --build-arg VITE_API_BASE_URL=https://api.forest.tobeunicorn.kr               --build-arg VITE_DASHBOARD_API_BASE_URL=https://api.forest.tobeunicorn.kr               -t forest-front-wildfire .

            docker rm -f forest-front-wildfire || true

            docker run -d               --name forest-front-wildfire               --restart unless-stopped               --log-opt max-size=10m               --log-opt max-file=5               -p 127.0.0.1:18030:80               forest-front-wildfire

            for attempt in $(seq 1 20); do
              status=$(docker inspect --format='{{.State.Health.Status}}' forest-front-wildfire)
              if test "$status" = healthy; then
                curl --fail --silent --show-error http://127.0.0.1:18030/health
                curl --fail --silent --show-error http://127.0.0.1:18030/demo-health | grep 'forest-service-demo'
                curl --fail --silent --show-error 'http://127.0.0.1:18030/?demo=1' | grep '<div id="root"></div>'
                exit 0
              fi
              test "$status" = unhealthy && docker logs --tail 100 forest-front-wildfire && exit 1
              sleep 3
            done

            docker logs --tail 100 forest-front-wildfire
            exit 1
